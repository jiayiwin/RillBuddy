<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>工作台</title>
  <link rel="stylesheet" href="/src/ui.css" />
  <link rel="stylesheet" href="/src/workbench-floor.css" />
  <style>
    body{padding:24px 30px 40px;font-size:14px}
    .head{display:flex;align-items:center;gap:14px;margin-bottom:18px}.head h1{margin:0;font-size:24px}.head p{margin:3px 0 0;color:var(--muted);font-size:12px}.head-actions{display:flex;gap:8px;margin-left:auto}.head-actions button{min-height:36px;padding:0 13px;border:1px solid var(--line-2);border-radius:999px;background:var(--panel);font:inherit;font-weight:700;color:var(--ink);cursor:pointer}.head-actions button.primary{border:0;background:var(--indigo);color:#fff}
    .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.filters input,.filters select{height:36px;border:1px solid var(--line-2);border-radius:999px;background:var(--panel);padding:0 13px;color:var(--ink);font:inherit}.filters input{flex:1;min-width:180px}.view-tabs{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--well);width:max-content;margin-bottom:14px}.view-tabs button{min-height:30px;padding:0 13px;border:0;border-radius:999px;background:transparent;font:inherit;font-weight:700;color:var(--ink-2);cursor:pointer}.view-tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 4px rgba(var(--shade),.16)}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;min-height:470px}.list,.detail{background:var(--panel);border:1px solid var(--line-2);border-radius:22px}.list{overflow:hidden}.rows{display:flex;flex-direction:column}.row{display:grid;grid-template-columns:9px minmax(0,1fr) 90px 110px;gap:10px;align-items:center;min-height:66px;padding:10px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;color:var(--ink);cursor:pointer}.row>span{min-width:0}.row:hover,.row.on{background:var(--t-lilac)}.row:last-child{border-bottom:0}.dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}.dot.needs_you,.dot.attention,.dot.error{background:var(--alert)}.mainline,.subline{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mainline{font-weight:800}.subline,.meta{color:var(--muted);font-size:12px}.state{text-align:right;font-size:12px;font-weight:700;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.empty{display:grid;place-items:center;min-height:300px;color:var(--muted)}
    .detail{padding:20px}.detail h2{margin:0 0 5px;font-size:18px}.detail .source{color:var(--muted);font-size:12px}.facts{display:flex;flex-direction:column;gap:10px;margin-top:18px}.fact{display:flex;gap:12px}.fact b{width:70px;flex:none;color:var(--muted);font-size:12px}.fact span{line-height:1.5;word-break:break-word}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}.actions button{min-height:36px;padding:0 13px;border:1px solid var(--line-2);border-radius:999px;background:var(--panel);font-weight:700}.actions .primary{border:0;background:var(--indigo);color:#fff}.hint{margin-top:16px;color:var(--muted);font-size:12px;line-height:1.6}.count{margin-left:auto;color:var(--muted);font-size:12px}.timeline{margin-top:16px;padding:18px 20px;background:var(--panel);border:1px solid var(--line-2);border-radius:22px}.timeline h2{margin:0 0 12px;font-size:16px}.event{display:grid;grid-template-columns:78px 110px minmax(130px,1fr) 96px;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:12px}.event:first-child{border-top:0}.event time,.event .kind{color:var(--muted)}.event .item,.event .detail{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.event .detail{color:var(--ink-2);text-align:right}@media(max-width:760px){.head-actions{margin-left:0}.head{align-items:flex-start;flex-wrap:wrap}.layout{grid-template-columns:1fr}.detail{min-height:220px}.row{grid-template-columns:9px minmax(0,1fr) 90px}.row .meta{display:none}.event{grid-template-columns:62px minmax(90px,1fr) minmax(90px,1fr);gap:7px}.event .detail{grid-column:2 / 4;text-align:left}}
  </style>
</head>
<body>
  <div class="head"><div><h1 data-en="Workbench">工作台</h1><p data-en="Everything that needs your attention, from agents and tasks to future sources.">Agent、任务和其他来源的工作项，都在这里。</p></div><div class="head-actions"><button id="clarify" class="primary">帮我理清</button><button id="storeroom">磁盘与桌面整理</button></div><span class="count" id="count"></span></div>
  <div class="filters"><input id="search" placeholder="搜索来源、项目或工作项…" data-en-placeholder="Search sources, projects or work items…" /><select id="kind"><option value="all">全部来源</option><option value="agent">Agent</option><option value="tasks">手上的事</option></select><select id="state"><option value="all">全部状态</option><option value="needs_you">需要你</option><option value="working">进行中</option><option value="waiting">等待中</option><option value="done">已完成</option><option value="parked">稍后处理</option></select></div>
  <div class="view-controls">
    <div class="view-tabs" role="group" aria-label="时间范围" data-en-label="Time range"><button type="button" id="view-current" class="on" aria-pressed="true" data-en="Now">现在</button><button type="button" id="view-history" aria-pressed="false" data-en="Last 7 days">最近 7 天</button></div>
    <div class="view-tabs" role="group" aria-label="显示方式" data-en-label="Display mode"><button type="button" id="display-list" class="on" aria-pressed="true" data-en="List">列表</button><button type="button" id="display-floor" aria-pressed="false" data-en="Workstations">工位</button></div>
  </div>
  <div class="layout"><section class="list"><div class="rows" id="rows"></div><div id="floor" class="floor" hidden></div><div class="empty" id="empty" hidden>还没有工作项。</div></section><aside class="detail" id="detail"><div class="empty">选择一件工作项查看详情。</div></aside></div>
  <section class="timeline"><h2>最近动态</h2><div id="history"><div class="empty">正在加载…</div></div></section>
  <script src="/embed.js"></script><script type="module" src="/src/workbench.ts"></script>
</body>
</html>
